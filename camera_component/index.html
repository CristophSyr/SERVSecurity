<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: transparent; font-family: sans-serif; }
  #container { position: relative; width: 100%; }
  video { width: 100%; border-radius: 8px; background: #000; }
  canvas { display: none; }
  .status { color: #10b981; font-size: 13px; margin-top: 4px; }
  .error { color: #ef4444; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status" class="status"></div>
</div>
<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  
  let capturing = false;
  let intervalId = null;

  // Get capture interval from Streamlit args (default 500ms)
  function getCaptureInterval() {
    try {
      const args = window.__STREAMLIT_ARGS__;
      return (args && args.capture_interval_ms) || 500;
    } catch(e) { return 500; }
  }

  function sendFrameToStreamlit(dataUrl) {
    // Send via Streamlit component API
    if (window.parent) {
      window.parent.postMessage({
        type: "streamlit:setComponentValue",
        value: dataUrl
      }, "*");
    }
  }

  function captureFrame() {
    if (!video.videoWidth || !video.videoHeight) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
    sendFrameToStreamlit(dataUrl);
  }

  async function startCamera() {
    try {
      statusEl.textContent = "Iniciando cámara...";
      statusEl.className = "status";
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      capturing = true;
      statusEl.textContent = "📹 Cámara activa - transmitiendo frames";
      
      // Start capturing frames
      const interval = getCaptureInterval();
      intervalId = setInterval(captureFrame, interval);
    } catch(err) {
      statusEl.textContent = "❌ Error: " + err.message;
      statusEl.className = "error";
    }
  }

  // Listen for Streamlit render events
  window.addEventListener("message", (event) => {
    if (event.data.type === "streamlit:render") {
      if (!capturing) startCamera();
      // Signal that component height is ready
      window.parent.postMessage({ type: "streamlit:setFrameHeight", height: document.body.scrollHeight }, "*");
    }
  });

  // Signal ready
  window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");

  // Start camera immediately as well
  startCamera();
</script>
</body>
</html>
